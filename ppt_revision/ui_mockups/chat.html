<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    background:#F0F4F8; width:640px; height:520px; padding:20px; color:#1E293B;
  }
  .panel {
    background:#fff; border-radius:12px; overflow:hidden; height:100%;
    box-shadow:0 4px 20px rgba(30,58,92,.10); border:1px solid #E2E8F0;
    display:flex; flex-direction:column;
  }
  .header {
    background:linear-gradient(135deg,#1B3A5C,#2E75B6); color:#fff;
    padding:11px 18px; font-size:14px; font-weight:600; display:flex; align-items:center; gap:10px;
  }
  .header .dot { width:8px; height:8px; border-radius:50%; background:#34D399; }
  .header .title { flex:1; }
  .chat-body { flex:1; padding:12px 16px; background:#F8FAFC; overflow:hidden; }
  .msg { display:flex; gap:9px; margin-bottom:9px; align-items:flex-start; }
  .avatar { width:28px; height:28px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff; font-weight:600; }
  .avatar.user { background:#94A3B8; }
  .avatar.ai { background:linear-gradient(135deg,#2E75B6,#2BA89C); }
  .bubble {
    background:#fff; border:1px solid #E2E8F0; border-radius:10px;
    padding:9px 12px; font-size:12.5px; line-height:1.5; max-width:500px;
  }
  .bubble.ai { border-top-left-radius:2px; }
  .nameplate {
    display:inline-block; width:150px; height:54px; margin:3px 0;
    background:linear-gradient(180deg,#B8C4D0,#8A9AAA); border-radius:4px;
    border:1px solid #6B7B8D; vertical-align:middle; position:relative; overflow:hidden;
  }
  .np-in { position:absolute; inset:5px; padding:4px 6px; }
  .np-in div { height:2.5px; background:rgba(255,255,255,.5); margin-bottom:2.5px; border-radius:1px; }
  .np-in div:nth-child(1){width:70%} .np-in div:nth-child(2){width:90%}
  .np-in div:nth-child(3){width:55%} .np-in div:nth-child(4){width:75%}
  .np-in div:nth-child(5){width:40%}
  .recog-label { font-size:11px; color:#64748B; margin-bottom:2px; }
  .recog-result { font-size:13.5px; font-weight:600; color:#1B3A5C; margin-bottom:7px; }
  .tag { display:inline-block; background:#EBF5FF; color:#2E75B6; font-size:10px;
    padding:1px 6px; border-radius:4px; font-weight:500; margin-left:5px; }
  .sim-title { font-size:11px; color:#64748B; margin-bottom:5px; }
  .sim-item {
    display:flex; align-items:center; justify-content:space-between;
    background:#F8FAFC; border:1px solid #E2E8F0; border-radius:7px;
    padding:6px 12px; margin-bottom:5px; font-size:12.5px;
  }
  .sim-item .code { font-weight:600; color:#2E75B6; font-family:Consolas,monospace; margin-right:7px; }
  .sim-item .desc { color:#475569; font-size:11.5px; flex:1; }
  .sim-item .btn { background:#fff; border:1px solid #2E75B6; color:#2E75B6;
    font-size:11px; padding:2px 12px; border-radius:5px; cursor:pointer; font-weight:500; }
  .new-btn { display:block; width:100%; margin-top:3px;
    background:linear-gradient(135deg,#2E75B6,#1B3A5C); color:#fff; border:none;
    padding:8px; border-radius:7px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
  .input-bar { border-top:1px solid #E2E8F0; padding:8px 14px; display:flex; gap:8px; align-items:center; background:#fff; }
  .input-bar .inp { flex:1; background:#F1F5F9; border-radius:7px; padding:7px 11px; font-size:11.5px; color:#94A3B8; }
  .input-bar .send { width:30px; height:30px; border-radius:7px; background:#2E75B6; color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:13px; }
</style>
</head>
<body>
<div class="panel">
  <div class="header"><span class="dot"></span><span class="title">AI 数据治理助手</span><span>⋯</span></div>
  <div class="chat-body">
    <div class="msg">
      <div class="avatar user">我</div>
      <div class="bubble">
        <div style="font-size:12px;color:#64748B;margin-bottom:4px;">帮我查一下这个物料</div>
        <div class="nameplate"><div class="np-in"><div></div><div></div><div></div><div></div><div></div></div></div>
      </div>
    </div>
    <div class="msg">
      <div class="avatar ai">AI</div>
      <div class="bubble ai">
        <div class="recog-label">识别结果</div>
        <div class="recog-result">六角头螺栓 M10×20 碳钢 发黑<span class="tag">铭牌识别</span></div>
        <div class="sim-title">找到 3 条相似编码，请确认：</div>
        <div class="sim-item"><span><span class="code">10-y-001</span><span class="desc">六角头螺栓 M8×16 碳钢 镀锌</span></span><button class="btn">选用</button></div>
        <div class="sim-item"><span><span class="code">10-y-002</span><span class="desc">六角头螺栓 M10×25 碳钢 发黑</span></span><button class="btn">选用</button></div>
        <div class="sim-item"><span><span class="code">10-y-003</span><span class="desc">六角头螺栓 M12×20 不锈钢</span></span><button class="btn">选用</button></div>
        <button class="new-btn">+ 以上都不是，新建物料申请</button>
      </div>
    </div>
  </div>
  <div class="input-bar"><div class="inp">输入物料描述，或上传铭牌 / 图纸…</div><div class="send">➤</div></div>
</div>
</body>
</html>
